[package]
name = "docker-hostmanager"
version = "0.1.0"
edition = "2021"
authors = ["Dalibor Karlović <dalibor.karlovic@sigwin.hr>"]
description = "Automatically update /etc/hosts with Docker container hostnames"
repository = "https://github.com/dkarlovi/docker-hostmanager.rs"
license = "MIT"
keywords = ["docker", "hosts", "networking", "containers"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[profile.release]
lto = "fat"

[dependencies]
bollard = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
clap = { version = "4", features = ["derive", "color", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
serde = { version = "1", features = ["derive"] }
colored = "3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Production-critical restriction lints
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"

# Catch development leftovers
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Good practices
exit = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
iter_over_hash_type = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
arithmetic_side_effects = "warn"
multiple_unsafe_ops_per_block = "warn"
infinite_loop = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# Allow for CLI apps (would warn in libraries)
print_stdout = "allow"
print_stderr = "allow"

# Disable overly pedantic lints
# Duplicate versions come from transitive dependencies (e.g. two `syn` majors)
# and can only be fixed upstream.
multiple_crate_versions = "allow"
too_many_lines = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
